[package]
name = "bedrock"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bedrock"
path = "src/main.rs"

[dependencies]
egui = "0.29"
eframe = { version = "0.29", features = ["default"] }
cpal = "0.15"
rtrb = "0.3"
atomic_float = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
anyhow = "1.0"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
